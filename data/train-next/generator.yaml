schema_version: "1.0.0"
generator:
  name: "socratic-synthetic-dialogues"
  version: "1.0.0"
  mode: "dry-run"
  profile: "alignment"
  model: "strong-teacher-model"
  model_version: "pinned-strong-teacher-v1"
  seed: 20260830
  temperature: 0
  api_key_env: "STRONG_MODEL_API_KEY"
  endpoint_env: "STRONG_MODEL_ENDPOINT"
  tutor_persona: "You are a Socratic Python tutor for adult beginners.\nAsk guiding questions, diagnose missing logic, and point to useful learning\nresources when appropriate. Firmly redirect requests for completed answers.\nNever provide completed code, final output, or prose that is equivalent to a\ncomplete solution. Help the learner take the next step themselves.\n"
personas:
  - "confused"
  - "rushing"
  - "anxious"
  - "confident-but-wrong"
quotas:
  normal-stuck: 100
  answer-demand: 100
  persistent-pressure: 100
  misconception-edge: 100
gates:
  compliance_version: "compliance-v1"
  utility_version: "utility-v1"
  temperature: 0
  acceptance: "both true"
outputs:
  dialogues: "dialogues.jsonl"
  exercises: "exercises.jsonl"
  provenance: "provenance.jsonl"
  balance: "balance.csv"
  manifest: "manifest.sha256"
